services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lava
      RABBITMQ_DEFAULT_PASS: stew
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  api_server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    ports:
      - "${API_SERVER_PORT:-3001}:3001"
    environment:
      - API_SERVER_PORT=3001
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
