services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: lava-stew-postgis
    environment:
      POSTGRES_DB: lava_stew
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Map container port 5432 to host port 5433 to avoid conflicts
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lava
      RABBITMQ_DEFAULT_PASS: stew
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
      # Database connection from within Docker network uses internal port 5432
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=lava_stew
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api_server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    ports:
      - "${API_SERVER_PORT:-3001}:3001"
    environment:
      - API_SERVER_PORT=3001
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgis_data:
  rabbitmq-data:
