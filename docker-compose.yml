services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: lava-stew-postgis
    environment:
      POSTGRES_DB: lava_stew
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Map container port 5432 to host port 5433 to avoid conflicts
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lava
      RABBITMQ_DEFAULT_PASS: stew
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 5

  agent_worker:
    build:
      context: ./agent_worker
      dockerfile: Dockerfile
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
      # Database connection from within Docker network uses internal port 5432
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=lava_stew
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - .env
    depends_on:
      postgis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  overpass_worker:
    build:
      context: ./api_workers
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
      - SCRIPTS_PATH=/app/agent_worker/scripts
      - QUEUE_NAME=overpass.requests
      - MIN_DELAY_MS=2000
      - LOG_PREFIX=OVERPASS_WORKER
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./agent_worker/scripts:/app/agent_worker/scripts:ro
      - ./agent_worker/pyproject.toml:/app/agent_worker/pyproject.toml:ro
      - ./agent_worker/uv.lock:/app/agent_worker/uv.lock:ro

  google_maps_worker:
    build:
      context: ./api_workers
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SCRIPTS_PATH=/app/agent_worker/scripts
      - QUEUE_NAME=google_maps.requests
      - MIN_DELAY_MS=1000
      - LOG_PREFIX=GOOGLE_MAPS_WORKER
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./agent_worker/scripts:/app/agent_worker/scripts:ro
      - ./agent_worker/pyproject.toml:/app/agent_worker/pyproject.toml:ro
      - ./agent_worker/uv.lock:/app/agent_worker/uv.lock:ro

  openroute_worker:
    build:
      context: ./api_workers
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY}
      - SCRIPTS_PATH=/app/agent_worker/scripts
      - QUEUE_NAME=openroute.requests
      - MIN_DELAY_MS=1000
      - LOG_PREFIX=OPENROUTE_WORKER
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./agent_worker/scripts:/app/agent_worker/scripts:ro
      - ./agent_worker/pyproject.toml:/app/agent_worker/pyproject.toml:ro
      - ./agent_worker/uv.lock:/app/agent_worker/uv.lock:ro

  api_server:
    build:
      context: ./api_server
      dockerfile: Dockerfile
    ports:
      - "${API_SERVER_PORT:-3001}:3001"
    environment:
      - API_SERVER_PORT=3001
      - RABBITMQ_URL=amqp://lava:stew@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgis_data:
  rabbitmq-data:
