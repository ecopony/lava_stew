# ABOUTME: RabbitMQ configuration for Lava Stew development environment
# ABOUTME: Sets absolute memory limits to avoid false alarms from system memory usage

# DEVELOPMENT ONLY: Use absolute memory watermark instead of percentage of system memory
# This prevents alarms when the host Mac's memory usage is high during local development
# WARNING: 512MB is too low for production - use percentage-based limits in production
vm_memory_high_watermark.absolute = 512MB
